name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Monthly canary: builds wheels (cibuildwheel/manylinux drift is otherwise
  # only discovered at actual release time, the worst moment). The publish
  # job below stays gated on refs/tags/v*, so a schedule run never publishes.
  schedule:
    - cron: '50 3 1 * *'

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: Wheels / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            cibw_archs_linux: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs_linux: aarch64
          - name: macos
            os: macos-latest
            cibw_archs_linux: ""
          - name: windows
            os: windows-latest
            cibw_archs_linux: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        # Pinned, not floating. Unpinned, the set of interpreters cibuildwheel
        # knows about grows on upstream's schedule rather than ours — which is
        # how cp314t and cp315 entered the build set between the 2026-08-01
        # canary and the v0.5.0 tag. With a pin, that set changes only when
        # someone bumps this line and watches the run.
        run: pip install cibuildwheel==4.2.0

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # macOS: build universal2 (x86_64 + arm64)
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # libstats v2.0.0 requires macOS 13 Ventura minimum
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.0"
          # Linux: set per-matrix (x86_64 on x64 runner, aarch64 on native ARM runner)
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
          # Windows: x86_64 only
          CIBW_ARCHS_WINDOWS: "AMD64"
          # ALLOWLIST, not a denylist. Until 2026-08-16 this was a CIBW_SKIP,
          # which failed open twice in one run: "cp314-*" does not match the
          # free-threaded "cp314t-" prefix, and nothing named cp315 because 3.15
          # did not exist when the line was written. Both got built, and cp315
          # took the run down — no scipy wheel exists for it, so
          # CIBW_TEST_REQUIRES fell back to a source build and died on missing
          # OpenBLAS. A denylist cannot express "only what ci.yml tests"; every
          # interpreter upstream adds ships untested until someone notices.
          #
          # The same prefix trap applies here: "cp314-*" alone does NOT cover
          # cp314t. Both are listed deliberately.
          #
          # 3.11 and 3.14 (both variants) are listed because 0.1.5 through 0.4.0
          # all published them, and dropping a target that already ships is a
          # regression — worse than it looks, since requires-python still admits
          # those users, so pip would offer them this version's SDIST and try to
          # compile libstats on their machine rather than falling back to the
          # last working release. cp315 is excluded until scipy ships a wheel
          # for it (it is CIBW_TEST_REQUIRES, not our build, that cannot cope).
          #
          # Only THREE distinct wheels come out of these five, because
          # wheel.py-api = "cp312" makes 3.12/3.13/3.14 converge on one
          # cp312-abi3 wheel: cp311-cp311, cp312-abi3, cp314-cp314t. The
          # apparent redundancy is the point — it installs and tests the abi3
          # wheel on interpreters it was not built with, the only check that
          # catches an abi3-TAGGED wheel wrapping a version-LOCKED binary.
          # Keep in lockstep with ci.yml's matrix.
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp314t-*"
          # musllinux is still a denylist entry: it is an ABI axis, orthogonal
          # to the interpreter allowlist above, and CIBW_SKIP is applied after
          # CIBW_BUILD.
          CIBW_SKIP: "*-musllinux_*"
          # Build dependencies (installed in the build environment)
          CIBW_BUILD_FRONTEND: "pip"
          # Test the built wheel
          CIBW_TEST_REQUIRES: "pytest scipy"
          CIBW_TEST_COMMAND: "pytest {project}/tests -q"
          # Ensure CMake is available in manylinux images
          CIBW_BEFORE_ALL_LINUX: "yum install -y cmake || apt-get install -y cmake || true"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pip install build && python -m build --sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.1)
        with:
          packages-dir: dist
