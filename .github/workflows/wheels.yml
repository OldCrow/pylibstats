name: Build wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Monthly canary: builds wheels (cibuildwheel/manylinux drift is otherwise
  # only discovered at actual release time, the worst moment). The publish
  # job below stays gated on refs/tags/v*, so a schedule run never publishes.
  schedule:
    - cron: '50 3 1 * *'

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: Wheels / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            cibw_archs_linux: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs_linux: aarch64
          - name: macos
            os: macos-latest
            cibw_archs_linux: ""
          - name: windows
            os: windows-latest
            cibw_archs_linux: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # macOS: build universal2 (x86_64 + arm64)
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # libstats v2.0.0 requires macOS 13 Ventura minimum
          CIBW_ENVIRONMENT_MACOS: "MACOSX_DEPLOYMENT_TARGET=13.0"
          # Linux: set per-matrix (x86_64 on x64 runner, aarch64 on native ARM runner)
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs_linux }}
          # Windows: x86_64 only
          CIBW_ARCHS_WINDOWS: "AMD64"
          # Skip PyPy, musllinux, older Pythons, and anything newer than the
          # versions actually tested in ci.yml (currently 3.11-3.13) — keep
          # this in lockstep with ci.yml's matrix so nothing ships untested
          # (mirrors pylibhmm's wheels.yml pattern; bump both together).
          CIBW_SKIP: "*-musllinux_* cp39-* cp310-* cp314-*"
          # Build dependencies (installed in the build environment)
          CIBW_BUILD_FRONTEND: "pip"
          # Test the built wheel
          CIBW_TEST_REQUIRES: "pytest scipy"
          CIBW_TEST_COMMAND: "pytest {project}/tests -q"
          # Ensure CMake is available in manylinux images
          CIBW_BEFORE_ALL_LINUX: "yum install -y cmake || apt-get install -y cmake || true"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pip install build && python -m build --sdist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1 (v1.14.1)
        with:
          packages-dir: dist
